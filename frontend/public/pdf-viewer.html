<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer</title>
  <!-- Load PDF.js from cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --page-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.05);
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #viewer-container {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    .pdf-page-wrapper {
      margin-bottom: 24px;
      box-shadow: var(--page-shadow);
      background-color: #ffffff;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 95%;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto !important;
    }

    /* Loader styling */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #64748b;
      margin-top: 60px;
    }

    .spinner {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #7c2d12; /* Matching app's primary/brownish color */
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-message {
      color: #ef4444;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="viewer-container">
    <div id="loader" class="loader-container">
      <div class="spinner"></div>
      <div style="font-size: 13px; font-weight: 600;">Loading Preview...</div>
    </div>
    <div id="pages-list" style="display: flex; flex-direction: column; align-items: center; width: 100%;"></div>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const fileUrl = urlParams.get('file');
      const loader = document.getElementById('loader');
      const pagesList = document.getElementById('pages-list');

      if (!fileUrl) {
        loader.innerHTML = '<div class="error-message">Error: No PDF file URL specified.</div>';
        return;
      }

      // Configure PDF.js
      const pdfjsLib = window['pdfjs-dist/build/pdf'];
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      // Load PDF document
      const loadingTask = pdfjsLib.getDocument(fileUrl);
      loadingTask.promise.then(function(pdf) {
        loader.style.display = 'none';

        // Render page
        const renderPage = function(pageNum) {
          return pdf.getPage(pageNum).then(function(page) {
            const wrapper = document.createElement('div');
            wrapper.className = 'pdf-page-wrapper';
            pagesList.appendChild(wrapper);

            const canvas = document.createElement('canvas');
            wrapper.appendChild(canvas);

            // Scale factor for crisp rendering
            const viewport = page.getViewport({ scale: 1.5 });
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
              canvasContext: context,
              viewport: viewport
            };

            return page.render(renderContext).promise;
          });
        };

        // Render pages sequentially to avoid browser crash/lag on large files
        let sequence = Promise.resolve();
        for (let i = 1; i <= pdf.numPages; i++) {
          (function(pageNum) {
            sequence = sequence.then(function() {
              return renderPage(pageNum);
            });
          })(i);
        }
      }).catch(function(error) {
        console.error('PDF rendering failed:', error);
        loader.innerHTML = '<div class="error-message">Failed to load preview. Please download the file to view it.</div>';
      });
    })();
  </script>
</body>
</html>
